{# In-panel confirmation, as in Figma: a check in a white circle, bold lead, then the rest. #}
<div class="co-banner co-banner-{{ tone|default:'green' }}" role="status">
  <span class="co-banner-check" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  <span><strong>{{ lead }}</strong>{% if rest %} {{ rest }}{% endif %}</span>
</div>
