{# Round icon for a care section. kind = "feeding", "medication" or "emergency". Paths are from the Figma icons. #}
<span class="care-icon care-icon-{{ kind }}" aria-hidden="true">
  {% if kind == "feeding" %}
    <svg viewBox="0 0 22 22" focusable="false" fill="none" stroke="currentColor" stroke-width="1.83" stroke-linecap="round" stroke-linejoin="round"><path d="M2.75 11.92h16.5"/><path d="M4.13 11.92l1.46 4.76a1.5 1.5 0 0 0 1.28.92h8.26a1.5 1.5 0 0 0 1.28-.92l1.46-4.76"/><g fill="currentColor" stroke="none"><circle cx="8.25" cy="9.17" r="1.19"/><circle cx="11.18" cy="7.52" r="1.19"/><circle cx="13.93" cy="9.17" r="1.19"/></g></svg>
  {% elif kind == "medication" %}
    <svg viewBox="0 0 22 22" focusable="false" fill="none" stroke="currentColor" stroke-width="1.83" stroke-linecap="round" stroke-linejoin="round"><path d="M5.41 11l7.5-5.26a3.2 3.2 0 0 1 3.68 5.26l-7.5 5.26A3.2 3.2 0 0 1 5.41 11z"/><path d="M8.8 7.88l4.4 6.24"/></svg>
  {% else %}
    <svg viewBox="0 0 22 22" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 6.42h11a2.75 2.75 0 0 1 2.75 2.75v6.41a2.75 2.75 0 0 1-2.75 2.75h-11a2.75 2.75 0 0 1-2.75-2.75V9.17A2.75 2.75 0 0 1 5.5 6.42z"/><path d="M8.25 6.42V5.04a1.38 1.38 0 0 1 1.38-1.37h2.75a1.38 1.38 0 0 1 1.37 1.37v1.38"/><path d="M11 9.63v5.5M8.25 12.38h5.5"/></svg>
  {% endif %}
</span>
