{# "Looking for" on the Explore pages: switching it runs the search on the other page. #}
{# Caregivers look for pets needing care, pet owners for caregivers (Figma "Explore" frames). #}
<div class="hero-field hero-looking">
  <label for="search-looking-for">Looking for</label>
  <select id="search-looking-for" name="looking_for" data-autosubmit>
    {% if user.caregiver_profile or user.account_profile.role == "caregiver" %}
      <option value="pets"{% if looking_for == "pets" %} selected{% endif %}>Pets needing care</option>
    {% else %}
      <option value="caregivers"{% if looking_for == "caregivers" %} selected{% endif %}>Caregivers</option>
    {% endif %}
    <option value="places"{% if looking_for == "places" %} selected{% endif %}>Pet-friendly places</option>
  </select>
</div>
