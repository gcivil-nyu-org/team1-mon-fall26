{# Figma "Report Inappropriate Content Confirmation": shown in the Messages pop-up. #}
<div class="report-card report-sent" role="status">
  <span class="report-sent-check" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  <h2 class="report-card-title" id="report-card-title">Report sent</h2>
  <p>{{ text }}</p>
  <button type="button" class="btn btn-dark" data-report-done>Done</button>
</div>
