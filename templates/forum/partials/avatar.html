{# Initials in a circle, in the person's color from Messages (Figma). #}
<span class="forum-avatar theme-{{ person.author_theme }}{% if person.author_role == 'Admin' %} forum-avatar-admin{% endif %}{% if large %} forum-avatar-large{% endif %}{% if small %} forum-avatar-small{% endif %}{% if tiny %} forum-avatar-tiny{% endif %}" aria-hidden="true">{{ person.author_initials }}</span>
