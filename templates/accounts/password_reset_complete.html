{% extends "accounts/auth_base.html" %}

{% block title %}Password updated | PawPal{% endblock %}

{% block auth_body %}
<div class="auth-status-header">
    <span class="auth-status-icon auth-status-icon--success" aria-hidden="true">{% include "partials/check_icon.html" %}</span>
    <h1 id="auth-title">Password updated</h1>
    <p class="auth-subtitle">You can now log in with your new password.</p>
</div>
<a class="auth-submit auth-submit-link" href="{% url 'login' %}">Log in</a>
{% endblock %}
