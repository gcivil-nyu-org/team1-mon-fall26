{# One icon per place category, as in the Figma map pins and list. #}
<svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{% if category == "dog_park" %}
  {# A two-tier pine tree with a trunk, as in the Figma list and pins. #}
  <path d="M12 3L7.5 9.5H10L5.5 16h13L14 9.5h2.5z"/><path d="M12 16v5"/>
{% elif category == "cafe" %}
  <path d="M4 9h12v4.5A5.5 5.5 0 0 1 10.5 19h-1A5.5 5.5 0 0 1 4 13.5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.5c0 1 1 1.5 1 2.5M12 3.5c0 1 1 1.5 1 2.5"/>
{% elif category == "outdoor_dining" %}
  {# A table under a patio umbrella. #}
  <path d="M3.5 10.5a8.5 6 0 0 1 17 0z"/><path d="M12 10.5V20"/><path d="M7.5 20h9"/><path d="M8 15.5h8"/>
{% elif category == "off_leash" %}
  {# A paw print: dogs run free here at set hours. #}
  <circle cx="6" cy="10" r="1.8"/><circle cx="9.5" cy="5.5" r="1.8"/><circle cx="14.5" cy="5.5" r="1.8"/><circle cx="18" cy="10" r="1.8"/><path d="M12 11c-3 0-5.5 3.6-5.5 6 0 1.6 1.2 2.5 2.7 2.5 1.1 0 1.8-.6 2.8-.6s1.7.6 2.8.6c1.5 0 2.7-.9 2.7-2.5 0-2.4-2.5-6-5.5-6z"/>
{% elif category == "dog_fountain" %}
  {# A water drop over a bowl. #}
  <path d="M12 3c-2.6 3.2-4 5.4-4 7.2a4 4 0 0 0 8 0c0-1.8-1.4-4-4-7.2z"/><path d="M4.5 16.5h15l-1.5 4h-12z"/>
{% elif category == "pet_store" %}
  <path d="M5.5 7.5h13l-1 12.5h-11z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/>
{% else %}
  <path d="M5 2.5v6.5a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2V2.5"/><path d="M7.5 2.5v19"/><path d="M19 15V2.5a4.5 4.5 0 0 0-4 4.5v6a2 2 0 0 0 2 2zm0 0v6.5"/>
{% endif %}
</svg>
