{# Round icon for a service on the caregiver profile. kind = "walk", "home", "feeding" or "paw" (Figma). #}
<span class="service-icon service-icon-{{ kind }}" aria-hidden="true">
  {% if kind == "walk" %}
    <svg width="30" height="30" viewBox="0 0 30 30" focusable="false" fill="currentColor"><g transform="rotate(-15 9 21)"><circle cx="2.5" cy="19.5" r="1.7"/><circle cx="5.7" cy="16.1" r="1.7"/><circle cx="9.7" cy="16.1" r="1.7"/><circle cx="12.9" cy="19.5" r="1.7"/><path d="M7.7 20.7c-2.4 0-4.4 2.4-4.4 4.3 0 1.3 1 1.9 2.1 1.9.9 0 1.5-.4 2.3-.4s1.4.4 2.3.4c1.1 0 2.1-.6 2.1-1.9 0-1.9-2-4.3-4.4-4.3z"/></g><g transform="rotate(-15 21 7)"><circle cx="14.5" cy="7" r="1.7"/><circle cx="17.7" cy="3.6" r="1.7"/><circle cx="21.7" cy="3.6" r="1.7"/><circle cx="24.9" cy="7" r="1.7"/><path d="M19.7 8.2c-2.4 0-4.4 2.4-4.4 4.3 0 1.3 1 1.9 2.1 1.9.9 0 1.5-.4 2.3-.4s1.4.4 2.3.4c1.1 0 2.1-.6 2.1-1.9 0-1.9-2-4.3-4.4-4.3z"/></g></svg>
  {% elif kind == "home" %}
    <svg width="24" height="24" viewBox="0 0 24 24" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11L12 5L20 11V20H4V11Z"/><path d="M10 20V15H14V20"/></svg>
  {% elif kind == "feeding" %}
    <svg width="26" height="26" viewBox="0 0 26 26" focusable="false" fill="none" stroke="currentColor" stroke-width="2.17" stroke-linecap="round" stroke-linejoin="round"><path d="M3.25 14.08h19.5"/><path d="M4.88 14.08l1.73 5.64a1.6 1.6 0 0 0 1.52 1.08h9.75a1.6 1.6 0 0 0 1.52-1.08l1.73-5.64"/><g fill="currentColor" stroke="none"><circle cx="9.75" cy="10.83" r="1.41"/><circle cx="13.22" cy="8.88" r="1.41"/><circle cx="16.47" cy="10.83" r="1.41"/></g></svg>
  {% else %}
    {% include "partials/paw_icon.html" %}
  {% endif %}
</span>
