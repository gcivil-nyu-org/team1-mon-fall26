{% load review_tags %}
<section class="review-list" aria-labelledby="reviews-heading">
  <div class="review-list-head">
    <h2 id="reviews-heading">{{ title }}</h2>
    {% if summary.count %}
      <p class="review-average"><strong>{{ summary.average }}</strong> {% paws summary.average %} <span class="muted">{{ summary.count }} review{{ summary.count|pluralize }}</span></p>
    {% endif %}
  </div>
  <div class="review-cards">
    {% for review in reviews %}
      {% include "reviews/partials/review_card.html" %}
    {% empty %}
      <p class="muted">{{ empty }}</p>
    {% endfor %}
  </div>
</section>
